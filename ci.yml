name: OmniStory Studio CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Application Startup and Endpoints
      run: |
        python -c "from app.main import app; print('App successfully loaded in CI!')"
        python -c "from app.engine.pipeline import MultiAgentBroadcastEngine; print('Engine tests passed!')"
